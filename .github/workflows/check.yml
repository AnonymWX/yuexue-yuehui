name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 数据 + 构建 + 类型
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Course data
        run: npm run check:courses

      - name: Build (Linux 大小写敏感)
        run: npm run build

      - name: TypeScript (观察期，暂不阻断)
        run: npx tsc --noEmit
        continue-on-error: true
